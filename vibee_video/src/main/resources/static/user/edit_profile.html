    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* =================================
           1. 页面专属内容区样式
        ==================================== */
        .main-content {
            flex: 1;
            padding: 2rem;
            background: #f6f8fb;
        }
        
        .content-header {
            margin-bottom: 2rem;
        }
        
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .page-subtitle {
            color: #666;
            font-size: 1rem;
        }
        
        /* =================================
           2. 个人资料表单
        ==================================== */
        .profile-form {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(102,126,234,0.07);
            padding: 2rem;
            max-width: 800px;
        }
        
        .form-section {
            margin-bottom: 2rem;
        }
        
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #fff;
            outline: none;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .form-control.textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .form-text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.5rem;
        }
        
        /* 头像上传区域 */
        .avatar-section {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            border: 2px dashed #e1e1e1;
            border-radius: 16px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        
        .avatar-section:hover {
            border-color: #667eea;
            background: #f3f6fd;
        }
        
        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1rem;
            border: 4px solid #fff;
            box-shadow: 0 4px 12px rgba(102,126,234,0.15);
        }
        
        .avatar-upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .avatar-upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.2);
        }
        
        .avatar-input {
            display: none;
        }
        
        /* 按钮组 */
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e1e1e1;
        }
        
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .btn-secondary {
            background: #fff;
            color: #666;
            border-color: #e1e1e1;
        }
        
        .btn-secondary:hover {
            background: #f8f9fa;
            border-color: #d1d8e6;
        }
        
        .btn-danger {
            background: #fff;
            color: #e74c3c;
            border-color: #e74c3c;
        }
        
        .btn-danger:hover {
            background: #e74c3c;
            color: #fff;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.2);
        }
        
        /* =================================
           3. 响应式调整
        ==================================== */
        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }
            
            .profile-form {
                padding: 1.5rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .profile-form {
                padding: 1rem;
            }
            
            .form-actions {
            flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">

        <div class="header-bg">
            <span class="bee bee-1">🐝</span>

        </div>
        <div class="user-avatar" tabindex="0">
            <img class="avatar-img" src="../images/default-avatar.svg" alt="用户头像">

                <div class="user-menu-item" onclick="window.location.href='../visitor/login.html'">登录</div>
                <div class="user-menu-item" onclick="window.location.href='../visitor/email_register.html'">注册</div>
            </div>

    </div>
    
    <div class="layout-container">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">主要功能</div>
                <ul class="sidebar-nav">
                    <li class="sidebar-nav-item">
                        <a href="../video/video_initial.html" class="sidebar-nav-link">

                            关键词搜索
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="../video/video_data_metrics.html" class="sidebar-nav-link">

                    </li>
                </ul>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">用户中心</div>
                <ul class="sidebar-nav">
                    <li class="sidebar-nav-item">
                        <a href="edit_profile.html" class="sidebar-nav-link active">
                            <i class="bi bi-person"></i>
                            个人资料
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="video_upload.html" class="sidebar-nav-link">

                            视频上传
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="liked_favorited_videos.html" class="sidebar-nav-link">

                        </a>
                    </li>
                    <li class="sidebar-nav-item">

                </ul>
            </div>
        </div>
        
        <div class="main-content">
            <div class="content-header">
                <h1 class="page-title">修改个人信息</h1>
                <p class="page-subtitle">更新你的个人资料和账户设置</p>
            </div>
            
            <!-- 个人资料表单 -->
            <div class="profile-form">
                <form id="profile-form">
                    <!-- 头像上传区域 -->
                    <div class="avatar-section">
                        <img src="../images/default-avatar.svg" alt="用户头像" class="avatar-preview" id="avatar-preview">
                        <div>
                            <button type="button" class="avatar-upload-btn" onclick="document.getElementById('avatar-input').click()">
                                <i class="bi bi-camera"></i>
                                更换头像
                            </button>
                            <input type="file" id="avatar-input" class="avatar-input" accept="image/*">
                        </div>
                        <div class="form-text">支持 JPG、PNG 格式，文件大小不超过 2MB</div>
                    </div>
                    
                    <!-- 基本信息 -->
                    <div class="form-section">
                        <div class="section-title">
                            <i class="bi bi-person-circle"></i>
                            基本信息
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="username">用户名</label>
                                <input type="text" class="form-control" id="username" value="vibee_user" required>
                                <div class="form-text">用户名将显示在你的个人主页上</div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="nickname">昵称</label>
                                <input type="text" class="form-control" id="nickname" value="Vibee用户" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="bio">个人简介</label>
                            <textarea class="form-control textarea" id="bio" placeholder="介绍一下你自己...">热爱分享生活，记录美好瞬间</textarea>
                            <div class="form-text">最多200个字符</div>
                        </div>
                    </div>
                    
                    <!-- 联系信息 -->
                    <div class="form-section">
                        <div class="section-title">
                            <i class="bi bi-envelope"></i>
                            联系信息
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="email">邮箱地址</label>
                                <input type="email" class="form-control" id="email" value="user@example.com" required>
                                <div class="form-text">用于账户安全和重要通知</div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="phone">手机号码</label>
                                <input type="tel" class="form-control" id="phone" placeholder="请输入手机号码">
                            </div>
                        </div>
                    </div>
                    
                    <!-- 隐私设置 -->
                    <div class="form-section">
                        <div class="section-title">
                            <i class="bi bi-shield-check"></i>
                            隐私设置
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="profile-visibility">个人资料可见性</label>
                                <select class="form-control" id="profile-visibility">
                                    <option value="public">公开</option>
                                    <option value="friends">仅好友可见</option>
                                    <option value="private">私密</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="comment-permission">评论权限</label>
                                <select class="form-control" id="comment-permission">
                                    <option value="all">所有人</option>
                                    <option value="friends">仅好友</option>
                                    <option value="none">关闭评论</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 按钮组 -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">重置</button>
                        <button type="button" class="btn btn-danger" onclick="deleteAccount()">删除账户</button>
                        <button type="submit" class="btn btn-primary">保存更改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script>
        // 头像上传功能
        document.getElementById('avatar-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert('文件大小不能超过2MB');
                    return;
                }
                // 预览
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('avatar-preview').src = evt.target.result;
                };
                reader.readAsDataURL(file);
                // 实际上传
                const formData = new FormData();
                formData.append('avatar', file);
                try {
                    const response = await fetch('http://localhost:9588/user/uploadAvatar', {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'
                    });
                    const result = await response.json();
                    if (result.code === 0) {
                        alert('头像上传成功！');
                    } else {
                        alert(result.msg || '头像上传失败');
                    }
                } catch (error) {
                    alert('头像上传失败，请检查网络');
                }
            }
        });
        
        // 资料保存
        document.getElementById('profile-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value,
                nickname: document.getElementById('nickname').value,
                bio: document.getElementById('bio').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                profileVisibility: document.getElementById('profile-visibility').value,
                commentPermission: document.getElementById('comment-permission').value
            };
            try {
                const response = await fetch('http://localhost:9588/user/updateProfile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'include'
                });
                const result = await response.json();
                if (result.code === 0) {
                    alert('资料保存成功！');
                } else {
                    alert(result.msg || '保存失败');
                }
            } catch (error) {
                alert('保存失败，请检查网络');
            }
        });
        
        // 重置表单
        function resetForm() {
            if (confirm('确定要重置所有更改吗？')) {
                document.getElementById('profile-form').reset();
                document.getElementById('avatar-preview').src = '../images/default-avatar.svg';
            }
        }
        
        // 删除账户
        function deleteAccount() {
            if (confirm('确定要删除账户吗？此操作不可撤销！')) {
                if (confirm('再次确认：删除账户将永久删除所有数据，包括视频、评论等。')) {
                    // 这里可以添加实际的删除账户逻辑
                    console.log('删除账户');
                    alert('账户删除请求已提交，我们将在7个工作日内处理。');
                }
            }
        }

        // 字符计数
        document.getElementById('bio').addEventListener('input', function() {
            const maxLength = 200;
            const currentLength = this.value.length;
            const remaining = maxLength - currentLength;
            
            if (currentLength > maxLength) {
                this.value = this.value.substring(0, maxLength);
            }
        });
</script>
</body>
